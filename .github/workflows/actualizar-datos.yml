name: Actualizar datos oficiales

on:
  schedule:
    - cron: "17 11 5 * *"   # día 5 de cada mes, 6:17 a. m. hora de Colombia
  workflow_dispatch:        # botón "Run workflow" en GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python actualizar.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/procesado
          git diff --cached --quiet || git commit -m "Actualización automática de EVA y ONI"
          git push
